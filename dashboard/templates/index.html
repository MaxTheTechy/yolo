<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Classroom Occupancy - {{ room_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <h1>{{ room_name }} Occupancy</h1>
    {% include "_nav.html" %}
  </div>

  <div class="current">
    <div class="metric">
      <span id="people-count">-</span>
      <label>People (capacity {{ room_capacity }})</label>
    </div>
    <div class="metric">
      <span id="occupancy-percent">-</span>
      <label>Occupancy</label>
    </div>
    <div class="metric">
      <span id="last-updated">-</span>
      <label>Last updated</label>
    </div>
  </div>

  <div class="current">
    <div class="metric small">
      <span id="peak-today">-</span>
      <label>Peak today</label>
    </div>
    <div class="metric small">
      <span id="peak-all-time">-</span>
      <label>Peak all-time</label>
    </div>
  </div>

  <h2>Today by Hour</h2>
  <div class="hourly-section">
    <table id="hourly-table">
      <thead>
        <tr><th>Hour</th><th>Avg inside</th><th>Max inside</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="hourly-chart-wrap">
      <svg id="hourly-chart" viewBox="0 0 280 220" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="snapshot-panel">
        <h3>Latest Snapshot</h3>
        <img id="latest-snapshot" alt="No snapshot available" />
        <div id="latest-snapshot-caption" class="snapshot-caption">-</div>
      </div>
    </div>
  </div>

  <h2>Last 7 Days</h2>
  <table id="daily-table">
    <thead>
      <tr><th>Date</th><th>Avg People</th><th>Max People</th><th>Peak Occupancy %</th><th>Samples</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Last 24 Hours (raw samples)</h2>
  <p class="in-out-summary"><b id="went-in-24h">-</b> people went in, <b id="went-out-24h">-</b> went out</p>
  <table id="history-table">
    <thead>
      <tr><th>Time</th><th>Inside</th><th>Occupancy %</th><th>Went in</th><th>Went out</th></tr>
      <!-- People count links to its snapshot when one was captured (kept 1h) -->
    </thead>
    <tbody></tbody>
  </table>

  <script>window.ROOM_ID = {{ room_id }}; window.ROOM_CAPACITY = {{ room_capacity }};</script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
